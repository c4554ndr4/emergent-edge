[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-edge"
version = "0.2.0"
description = "Evidence-based research into edge-case user behavior in AI interactions"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Cassandra Melax"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "tqdm>=4.66",
    "numpy>=1.26",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-q"
pythonpath = ["src"]

[tool.typer]
colored_help = true

[tool.setuptools.package-data]
src = ["prompts/*.txt", "prompts/loose/*.txt"]
